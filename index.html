<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORME. — Wear Your Identity</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#171714;font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#f8f7f3;display:flex;align-items:center;justify-content:space-between;padding:20px 6%;border-bottom:1px solid #ddd}.logo{font-size:30px;font-weight:700;letter-spacing:-2px}.logo span,h1 span{color:#a28e76}nav{display:flex;gap:25px}nav button,.plain{border:0;background:none}nav button{font-size:12px;letter-spacing:2px}.hero{min-height:650px;background:linear-gradient(90deg,#0009,transparent),url('https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1800') center 38%/cover;display:flex;align-items:center;padding:7%;color:white}.hero h1{font-size:clamp(56px,9vw,130px);letter-spacing:-5px;line-height:.95;margin:20px 0}.hero em,h2 em{font-family:'Playfair Display',serif;font-weight:500}.eyebrow{font-size:11px;letter-spacing:3px}.cta{padding:17px 26px;background:#171714;color:white;border:1px solid #171714;font-size:12px;letter-spacing:1px}.hero .cta{background:#fff;color:#171714;border-color:#fff}.section{padding:75px 6%}.intro{text-align:center;max-width:800px;margin:auto}.intro h2,.heading{font-size:clamp(35px,5vw,66px);font-weight:500;letter-spacing:-2px}.muted{color:#777}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.product{border:0;text-align:left;background:transparent;padding:0}.product img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#e8e5df}.product strong{display:block;margin-top:13px}.product small{color:#777}.row{display:flex;justify-content:space-between;gap:20px;align-items:center}.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:30px}.filters button{border:1px solid #bbb;background:transparent;padding:10px 18px}.filters .active{background:#171714;color:#fff}.detail{display:grid;grid-template-columns:1fr 1fr;gap:7%;align-items:start}.detail>img{width:100%;max-height:740px;object-fit:cover}.detail h1{font-size:clamp(35px,5vw,68px)}.choices{display:flex;gap:10px;margin:16px 0 28px;flex-wrap:wrap}.choices button{padding:11px 15px;border:1px solid #aaa;background:transparent}.choices .selected{background:#171714;color:white}.cart-item{display:flex;align-items:center;gap:18px;border-bottom:1px solid #ddd;padding:18px 0}.cart-item img{width:75px;height:95px;object-fit:cover}.cart-item>div{flex:1}.cart-item button{border:1px solid #bbb;background:none;padding:5px 10px}.checkout{display:grid;grid-template-columns:1.3fr 1fr;gap:8%}input{width:100%;padding:15px;border:1px solid #bbb;background:#fff;margin:8px 0}.panel{background:#eeece6;padding:30px}.total{font-size:24px;font-weight:bold}.banner{min-height:420px;background:linear-gradient(90deg,#0009,transparent),url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1400') center/cover;color:white;display:flex;align-items:center;padding:8%}.banner h2{font-size:65px}footer{padding:50px 6%;background:#171714;color:white;display:flex;justify-content:space-between}.hidden{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.detail,.checkout{grid-template-columns:1fr}nav{gap:8px}nav button{font-size:10px}.hero{min-height:520px}.section{padding:45px 5%}}@media(max-width:450px){header{padding:16px 4%}.logo{font-size:24px}nav button:first-child{display:none}.grid{gap:12px}.hero h1{letter-spacing:-2px}footer{display:block}}
</style></head><body><header><button class="plain logo" onclick="route('home')">FORME<span>.</span></button><nav><button onclick="route('home')">HOME</button><button onclick="route('shop')">SHOP ALL</button><button onclick="filter('Tops');route('shop')">ESSENTIALS</button></nav><button class="plain" onclick="route('cart')">BAG (<span id="count">0</span>)</button></header><main id="app"></main><footer><div><div class="logo">FORME.</div><p>Contemporary essentials.<br>Made for your everyday.</p></div><div>© 2026 FORME. · CONCEPT STORE</div></footer><script>
const photos=['photo-1521572163474-6864f9cf17ab','photo-1598032895397-b9472444bf93','photo-1473966968600-fa801b869a1a','photo-1591047139829-d91aecb6caea','photo-1576566588028-4147f3842f27','photo-1542272604-787c3835535d','photo-1551028719-00167b16eac5','photo-1588850561407-ed78c282e89b'];const names=['The Essential Tee','Relaxed Cotton Shirt','Wide-Leg Trouser','Studio Overshirt','Everyday Knit','The Modern Denim','Form Jacket','Daily Cap'];const cats=['Tops','Tops','Bottoms','Outerwear','Tops','Bottoms','Outerwear','Accessories'];const prices=[129,219,259,329,249,279,399,89];const products=names.map((name,id)=>({id,name,category:cats[id],price:prices[id],image:'https://images.unsplash.com/'+photos[id]+'?auto=format&fit=crop&w=800&q=85'}));let cart=JSON.parse(localStorage.getItem('forme-cart')||'[]'),category='All',selected=0,size='M',color='Onyx';const rm=n=>'RM '+n.toFixed(2),p=id=>products[id],subtotal=()=>cart.reduce((n,x)=>n+p(x.id).price*x.qty,0),shipping=()=>subtotal()>=350?0:15;function save(){localStorage.setItem('forme-cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.reduce((n,x)=>n+x.qty,0)}function cards(list){return '<div class="grid">'+list.map(x=>'<button class="product" onclick="detail('+x.id+')"><img src="'+x.image+'" alt="'+x.name+'" loading="lazy"><strong>'+x.name+'</strong><div class="row"><small>'+x.category+'</small><span>'+rm(x.price)+'</span></div></button>').join('')+'</div>'}function route(page){window.scrollTo(0,0);const a=document.getElementById('app');if(page==='home')a.innerHTML='<section class="hero"><div><div class="eyebrow">THE NEW EDITION / 2026</div><h1>LESS,<br><em>BUT BETTER.</em></h1><p>Modern essentials for a life in motion.</p><button class="cta" onclick="route(\'shop\')">EXPLORE THE COLLECTION →</button></div></section><section class="section intro"><div class="eyebrow">THE FORME PHILOSOPHY</div><h2>Considered pieces.<br><em>Uncomplicated living.</em></h2><p class="muted">Thoughtful silhouettes, timeless tones, and the freedom to make every look your own.</p></section><section class="section"><div class="row"><h2 class="heading">New & Noteworthy.</h2><button class="plain" onclick="route(\'shop\')">VIEW ALL →</button></div>'+cards(products.slice(0,4))+'</section><section class="banner"><div><div class="eyebrow">AN EXERCISE IN SIMPLICITY</div><h2>Find your<br><em>own form.</em></h2><button class="cta" onclick="route(\'shop\')">DISCOVER FORME →</button></div></section>';if(page==='shop')a.innerHTML='<section class="section"><div class="eyebrow">THE COLLECTION / 001</div><h1 class="heading">Everyday <em>essentials.</em></h1><p class="muted">Made to move with you. Designed to stay.</p><div class="filters">'+['All','Tops','Bottoms','Outerwear','Accessories'].map(c=>'<button class="'+(category===c?'active':'')+'" onclick="filter(\''+c+'\')">'+c+'</button>').join('')+'</div>'+cards(products.filter(x=>category==='All'||x.category===category))+'</section>';if(page==='product'){let x=p(selected);a.innerHTML='<section class="section detail"><img src="'+x.image+'" alt="'+x.name+'"><div><button class="plain" onclick="route(\'shop\')">← BACK TO COLLECTION</button><p class="eyebrow">FORME / '+x.category.toUpperCase()+'</p><h1>'+x.name+'.</h1><h3>'+rm(x.price)+'</h3><p class="muted">Considered everyday essentials with timeless form and an effortless silhouette.</p><p>COLOUR — '+color+'</p><div class="choices">'+['Onyx','Chalk','Stone'].map(c=>'<button class="'+(color===c?'selected':'')+'" onclick="color=\''+c+'\';route(\'product\')">'+c+'</button>').join('')+'</div><p>SIZE — '+size+'</p><div class="choices">'+['XS','S','M','L','XL'].map(s=>'<button class="'+(size===s?'selected':'')+'" onclick="size=\''+s+'\';route(\'product\')">'+s+'</button>').join('')+'</div><button class="cta" onclick="add()">ADD TO BAG — '+rm(x.price)+' →</button><p id="cart-notice" role="status" aria-live="polite" hidden></p><p class="muted">Free shipping on orders over RM350 · Demo only</p></div></section>'}if(page==='cart'){a.innerHTML='<section class="section"><h1 class="heading">Your bag.</h1>'+(cart.length?cart.map((x,i)=>'<div class="cart-item"><img src="'+p(x.id).image+'"><div><strong>'+p(x.id).name+'</strong><p>'+x.color+' / '+x.size+'</p><p>'+rm(p(x.id).price)+'</p></div><button onclick="qty('+i+',-1)">−</button><span>'+x.qty+'</span><button onclick="qty('+i+',1)">+</button></div>').join('')+'<h2>Subtotal: '+rm(subtotal())+'</h2><p>Shipping: '+(shipping()?rm(shipping()):'FREE')+'</p><button class="cta" onclick="route(\'checkout\')">CHECKOUT →</button>':'<p>Your bag is empty.</p><button class="cta" onclick="route(\'shop\')">SHOP NOW →</button>')+'</section>'}if(page==='checkout'){if(!cart.length){route('cart');return}a.innerHTML='<section class="section checkout"><div><h1 class="heading">Checkout.</h1><p class="muted">Demonstration only. No payment will be collected.</p><form onsubmit="event.preventDefault();finish()"><h3>CONTACT</h3><input required type="email" placeholder="Email address"><h3>SHIPPING DETAILS</h3><input required placeholder="Full name"><input required placeholder="Street address"><input required placeholder="City"><input required placeholder="Postcode"><input required placeholder="State / Region"><h3>PAYMENT</h3><p>✓ Demo payment — no charge</p><button class="cta" type="submit">PLACE DEMO ORDER →</button></form></div><aside class="panel"><h3>ORDER SUMMARY</h3>'+cart.map(x=>'<p>'+p(x.id).name+' × '+x.qty+' — '+rm(p(x.id).price*x.qty)+'</p>').join('')+'<hr><p>Shipping: '+(shipping()?rm(shipping()):'FREE')+'</p><p class="total">TOTAL: '+rm(subtotal()+shipping())+'</p></aside></section>'}if(page==='success')a.innerHTML='<section class="section intro"><div class="eyebrow">ORDER CONFIRMED / DEMO</div><h1 class="heading">Thank you.</h1><p>Concept order '+window.orderId+' confirmed. No payment was made or order transmitted.</p><button class="cta" onclick="route(\'home\')">BACK TO HOME →</button></section>';save()}function filter(c){category=c;route('shop')}function detail(id){selected=id;size='M';color='Onyx';route('product')}function add(){let x=cart.find(x=>x.id===selected&&x.size===size&&x.color===color);x?x.qty++:cart.push({id:selected,size,color,qty:1});save();const notice=document.getElementById('cart-notice');if(notice){notice.textContent='Added to bag ✓';notice.hidden=false}}function qty(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);save();route('cart')}function finish(){window.orderId='FRM-'+Math.floor(100000+Math.random()*900000);cart=[];save();route('success')}route('home');
</script></body></html>
